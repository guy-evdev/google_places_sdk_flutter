name: CI

on:
  push:
    branches: [main, master]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  minimum-sdk:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false
      - name: Set up minimum Flutter
        uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2
        with:
          flutter-version: 3.35.7
          cache: true
      - run: flutter pub get
      - run: flutter analyze
      - run: flutter test

  release-gates:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false
      - name: Set up latest stable Flutter
        uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2
        with:
          channel: stable
          cache: true
      - run: flutter pub get
      - name: Verify formatting
        run: dart format --output=none --set-exit-if-changed .
      - run: flutter analyze
      - name: VM tests with coverage
        run: flutter test --coverage
      - name: Enforce 85% line coverage
        run: |
          awk -F '[:,]' '$1 == "DA" { total++; covered += ($3 > 0) } END { if (total == 0 || covered * 100 / total < 85) exit 1; printf "Line coverage: %.2f%%\n", covered * 100 / total }' coverage/lcov.info
      - name: Chrome tests
        run: flutter test --platform chrome
      - name: Dartdoc
        run: dart doc --dry-run
      - name: Example tests
        working-directory: example
        run: flutter test
      - name: Example web build
        working-directory: example
        run: flutter build web --dart-define=GOOGLE_MAPS_API_KEY=ci-placeholder
      - name: Publish validation
        run: flutter pub publish --dry-run
      - name: Pana
        run: |
          dart pub global activate pana
          dart pub global run pana:pana --no-warning
