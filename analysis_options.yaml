include: package:flutter_lints/flutter.yaml

analyzer:
  exclude:
    - build/**
  language:
    strict-casts: true
    strict-inference: true
    strict-raw-types: true

# `public_member_api_docs` and `comment_references` are required by this package's documentation
# rules. Measured 2026-08-02: 251 + 8 findings, 206 of them in lib/src/models/place_models.dart.
# Enabling them now would fail `flutter analyze` on every push, and suppressing with `// ignore:`
# is not permitted — so they are enabled as part of the documentation batch, not before.
# linter:
#   rules:
#     - public_member_api_docs
#     - comment_references

